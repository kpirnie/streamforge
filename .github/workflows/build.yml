name: Release

on:
  push:
    branches: [develop]
    tags:
      - '**'
      - '!beta'
      - '!beta-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release assets
        env:
          CGO_ENABLED: '0'
          GOARM: '5'
        run: |
          mkdir release
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          build() {
            local os=$1 arch=$2 suffix=
            if [[ "$os" == windows ]]; then
              suffix=.exe
              go run ./internal/winicon "$arch" "streamforge_windows_$arch.syso"
            fi
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.buildRevision=$GITHUB_SHA -X main.buildDate=$built" \
              -o "release/streamforge-$os-$arch$suffix" .
          }
          for arch in 386 amd64 arm arm64 loong64 mips mips64 mips64le mipsle ppc64 ppc64le riscv64 s390x; do
            build linux "$arch"
          done
          for arch in amd64 arm64; do
            build darwin "$arch"
          done
          for arch in 386 amd64 arm64; do
            build windows "$arch"
          done
          cp bootstrap.sh bootstrap.ps1 release/
          cd release
          sha256sum streamforge-* bootstrap.sh bootstrap.ps1 > SHA256SUMS

      - name: Refresh rolling beta
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer develop commit is available. Skipping this beta build."
            exit 0
          fi
          ref_api="repos/$GITHUB_REPOSITORY/git/refs"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/beta" >/dev/null 2>&1; then
            gh api --method PATCH "$ref_api/tags/beta" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "$ref_api" -f ref=refs/tags/beta -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Rolling prerelease from develop at $GITHUB_SHA."
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload beta release/streamforge-* release/bootstrap.* --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload beta release/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit beta --repo "$GITHUB_REPOSITORY" --title beta --notes "$notes" \
              --draft=false --prerelease --latest=false
          else
            gh release create beta release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title beta --notes "$notes" --prerelease --latest=false
          fi

      - name: Publish stable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" \
            --title "StreamForge $tag" --generate-notes --verify-tag --latest
