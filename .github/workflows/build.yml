name: Release

on:
  push:
    branches: [main]
    tags:
      - '**'
      - '!beta-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Linux release assets
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARM: '5'
        run: |
          mkdir release
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for arch in 386 amd64 arm arm64 loong64 mips mips64 mips64le mipsle ppc64 ppc64le riscv64 s390x; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.buildRevision=$GITHUB_SHA -X main.buildDate=$built" \
              -o "release/streamforge-linux-$arch" .
          done
          cp bootstrap.sh release/
          cd release
          sha256sum streamforge-* bootstrap.sh > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            tag="beta-$GITHUB_SHA"
            options=(--target "$GITHUB_SHA" --prerelease)
            latest=--latest=false
          else
            tag="$GITHUB_REF_NAME"
            options=(--verify-tag)
            latest=--latest
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$tag" --draft=false "$latest" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" \
            --title "StreamForge $tag" --generate-notes "${options[@]}" "$latest"
